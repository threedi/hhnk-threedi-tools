[workspace]
channels = ["conda-forge"]
name = "vergelijkingstool"
platforms = ["win-64"]

[tasks]

update-tools = """
git -C packages/hhnk-threedi-tools switch 26057-Vergelijkingstool &&
git -C packages/hhnk-threedi-tools pull --ff-only origin 26057-Vergelijkingstool
"""

start = "jupyter lab --FileCheckpoints.checkpoint_dir=.pixi/checkpoints packages/hhnk-threedi-tools/hhnk_threedi_tools/core/vergelijkingstool/app/vergelijkingstool.ipynb"

run = """
git -C packages/hhnk-threedi-tools switch 26057-Vergelijkingstool &&
git -C packages/hhnk-threedi-tools pull --ff-only origin 26057-Vergelijkingstool &&
jupyter lab --FileCheckpoints.checkpoint_dir=.pixi/checkpoints app/vergelijkingstool.ipynb
"""

# ---------------------------------------------------------------------------
# [dependencies]
# Same as main hhnk-threedi-tools
# builds GDAL/HDF5/NumPy.
# ---------------------------------------------------------------------------
[dependencies]
python = "3.12.*"
geopandas = "==1.0.1"
numpy = "==1.26.4"
pandas = "==2.2.2"
scipy = "==1.13.0"
urllib3 = "2.*"
 
gdal = "*"
h5py = "*"          
hdf5 = "*"
rasterstats = "*"
rioxarray = "*"
rtree = "*"
pyogrio = "*"
dask = "*"
xarray = "*"
cftime = "*"
folium = "*"
matplotlib = "*"   
cached_property = "*"
openpyxl = "*"
tqdm = "*"
 
jupyterlab = "*"
ipywidgets = "*"
 
pip = "*"
git = ">=2.51.1,<3"
gitpython = ">=3.1.45,<4"

[tool.setuptools]
packages = { find = { where = ["."] } }

# ---------------------------------------------------------------------------
# [pypi-dependencies]
# ---------------------------------------------------------------------------
[pypi-dependencies]
threedi-api-client = "==4.1.12"
threedi-modelchecker = "==2.18.3"
threedi-schema = "==0.300.26"
threedi-scenario-downloader = "*"
threedi_mi_utils = "==0.1.10"
threedigrid = "==2.3.5"
threedigrid-builder = ">=1.24.3"
threedidepth = "==0.6.3"
lazy_loader = "*"
dotenv = "*"

hhnk-research-tools = { git = "https://github.com/hhnk/hhnk-research-tools.git", rev = "main" }